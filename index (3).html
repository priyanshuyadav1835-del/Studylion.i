<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Lion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
:root{--bg:#050805;--card:#0b100c;--line:#16301f;--green:#22c55e;--text:#f4f7f4;--muted:#93a39a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#0d2a17 0,var(--bg) 55%);color:var(--text);font-family:"Playfair Display","Noto Sans Devanagari",Georgia,sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font-family:inherit}
[hidden]{display:none!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;padding:12px 18px;background:var(--bg)}
.ib{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--green);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib svg{width:22px;height:22px}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 18px;flex:1}
.ib:focus-visible,.cls:focus-visible,.batch:focus-visible,.tab:focus-visible,.lec:focus-visible,.dl:focus-visible,input:focus-visible,.app:focus-visible{outline:3px solid var(--green);outline-offset:3px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
#drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;z-index:50;background:#070c08;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 20px;display:flex;flex-direction:column;gap:8px;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
body.open #scrim{opacity:1;visibility:visible}
body.open #drawer{transform:none;visibility:visible}
#drawer h2{margin:0 0 12px;color:var(--green);font-size:1.4rem}
.dl{background:var(--card);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:12px;text-align:left;font-size:1rem;cursor:pointer}
.made{margin-top:auto;color:var(--muted);font-size:.9rem;padding-top:16px}
.made b{color:var(--green)}
#home{text-align:center;padding-top:6px}
.lion{width:190px;height:190px;filter:drop-shadow(0 0 18px rgba(255,190,40,.7)) drop-shadow(0 0 40px rgba(34,197,94,.5))}
h1{font-size:2.1rem;margin:12px 0 0;line-height:1.2}
h1 em{display:block;font-style:normal;color:var(--green);font-size:2.6rem;text-shadow:0 0 22px rgba(34,197,94,.45)}
.tag{margin:10px 0 28px;font-size:1.05rem}
.tag b{color:var(--green)}
.apps>.app:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 7px)}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));justify-content:center;gap:60px 14px;margin-top:50px;align-items:start}
.app{position:relative;display:block;padding:30px 8px 20px;background:var(--card);border:1px solid var(--line);border-radius:24px;color:var(--text);text-decoration:none;cursor:pointer;box-shadow:0 0 30px rgba(34,197,94,.08)}
.icon{position:relative;isolation:isolate;width:92px;height:92px;margin:0 auto 14px}
.icon img{width:100%;height:100%;border-radius:24px;border:2px solid var(--green);box-shadow:0 0 18px rgba(34,197,94,.5);display:block}
.icon svg{position:absolute;left:50%;pointer-events:none}
.icon svg.peek{width:140px;height:140px;margin-left:-70px;top:-88px;z-index:-1;filter:drop-shadow(0 0 16px rgba(255,190,40,.6)) drop-shadow(0 0 30px rgba(34,197,94,.45))}
.icon svg.paws{width:100px;height:30px;margin-left:-50px;top:-8px;z-index:2}
.app span{font-size:1.1rem;font-weight:700}
.app small{display:block;color:var(--muted);margin-top:4px;font-size:.85rem}
#app{display:none;padding-top:4px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top img{width:46px;height:46px;border-radius:12px;border:2px solid var(--green)}
.top h2{margin:0;font-size:1.2rem;line-height:1.2}
.top p{margin:0;color:var(--muted);font-size:.8rem}
.classes{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:22px}
.cls{display:block;width:100%;text-align:center;padding:34px 16px;border-radius:20px;background:linear-gradient(160deg,#10281a,var(--card));border:1.5px solid var(--line);color:var(--text);cursor:pointer}
.cls b{display:block;font-size:2.4rem;line-height:1.2}
.cls small,.chead small{display:block;margin-top:8px;color:var(--muted);font-size:1rem}
.cls em,.chead em{font-style:normal;color:var(--green);font-weight:700}
.cls:active{border-color:var(--green)}
.chead{text-align:center;margin:6px 0 22px}.chead b{display:block;font-size:2.3rem;line-height:1.2}
.lion{animation:lfloat 3.6s ease-in-out infinite,lglow 2.6s ease-in-out infinite}
.icon svg.peek{transform-origin:50% 85%;animation:lbob 3s ease-in-out infinite,lglow 2.6s ease-in-out infinite}
.icon svg.paws{transform-origin:50% 100%;animation:lpaw 3s ease-in-out infinite}
@keyframes lglow{0%,100%{filter:drop-shadow(0 0 12px rgba(255,190,40,.5)) drop-shadow(0 0 26px rgba(34,197,94,.35))}50%{filter:drop-shadow(0 0 26px rgba(255,215,80,1)) drop-shadow(0 0 54px rgba(34,197,94,.85))}}
@keyframes lfloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes lbob{0%,100%{transform:translateY(2px) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes lpaw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.lion,.icon svg.peek,.icon svg.paws{animation:none}}
.cls.on{background:var(--green);border-color:var(--green);color:#03120a}
.hint,.empty{color:var(--muted);font-size:.95rem;border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
.batch{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--green);border-radius:16px;padding:20px 18px;color:var(--text);cursor:pointer;box-shadow:0 0 22px rgba(34,197,94,.1)}
.batch b{display:block;font-size:1.25rem}
.batch small{color:var(--muted)}
.bt{margin:0 0 12px;font-size:1.3rem}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-size:1rem;font-weight:700;cursor:pointer}
.tab.on{border-color:var(--green);color:var(--green)}
.player{aspect-ratio:16/9;width:100%;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.player iframe{width:100%;height:100%;border:0}
.lec{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;margin-bottom:8px;font-size:1rem;cursor:pointer;text-decoration:none}
.lec[aria-current="true"]{border-color:var(--green)}
.subj{font-size:clamp(2.1rem,11.5vw,3.3rem);font-weight:800;letter-spacing:.12em;text-align:center;color:var(--green);line-height:1.1;margin:6px 0 4px;text-shadow:0 0 26px rgba(34,197,94,.5)}
.subj::after{content:"";display:block;width:70px;height:3px;border-radius:2px;background:var(--green);margin:12px auto 0}
.bt{text-align:center;margin-top:16px}
.sec{margin:20px 0 8px;font-size:1.1rem;color:var(--green)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cards.one{grid-template-columns:1fr}.cards .batch:last-child:nth-child(odd){grid-column:1/-1}
.cards .batch{padding:22px 14px;min-height:92px}.cards .batch b{font-size:1.1rem;line-height:1.3}
.subj.sm{font-size:clamp(1.6rem,8.6vw,2.5rem);letter-spacing:.08em}
.ph{margin:4px 0 10px}
.vi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 12px;margin-bottom:8px;font-size:.95rem;line-height:1.4;cursor:pointer}
.vi.on{border-color:var(--green);background:#0d2016}
.vn{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:9px;background:#10281a;color:var(--green);font-weight:800;display:flex;align-items:center;justify-content:center}
.vt{min-width:0}
.vmore{display:none;width:100%;padding:12px;background:none;border:1.5px solid var(--green);color:var(--green);border-radius:10px;font-weight:700;margin:6px 0 14px;cursor:pointer}
.vi:focus-visible,.vmore:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.chap{margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.chh{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:0;color:var(--text);text-align:left;cursor:pointer}
.chh b{display:block;font-size:1rem;line-height:1.35}
.chh small{color:var(--muted)}
.car{margin-left:auto;color:var(--green);transition:transform .2s}
.chh[aria-expanded="true"] .car{transform:rotate(180deg)}
.chb{padding:0 10px 4px}
.chh:focus-visible{outline:3px solid var(--green);outline-offset:-3px}
.player.off{position:fixed;left:-9999px;top:0;width:320px;margin:0}
.player.stk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.cc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(160deg,#10281a,var(--card));border:1px solid var(--line);border-radius:18px;color:var(--text);padding:16px 14px;cursor:pointer;box-shadow:0 0 22px rgba(34,197,94,.07)}
.cc:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.cc[aria-expanded="true"]{border-color:var(--green);border-bottom-left-radius:0;border-bottom-right-radius:0}
.pill{flex:none;min-width:64px;text-align:center;padding:7px 10px;border-radius:999px;background:var(--green);color:#03120a;font-weight:800;font-size:.82rem;font-family:Arial,sans-serif;white-space:nowrap}
.cc .vt{flex:1}.cc b{display:block;font-size:1.02rem;line-height:1.35}.cc small{color:var(--muted);font-size:.85rem}
.go{flex:none;width:34px;height:34px;border-radius:50%;background:#10281a;color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;transition:transform .2s}
.cc[aria-expanded="true"] .go{transform:rotate(180deg)}
.c2{margin-bottom:12px}
.lb{padding:10px 10px 2px;border:1px solid var(--green);border-top:0;border-radius:0 0 18px 18px;background:#08100a}
.vi.done .vn{background:var(--green);color:#03120a}
footer{text-align:center;color:var(--muted);padding:26px 0 18px;font-size:.9rem}
footer b{color:var(--green)}
</style>
</head>

p.innerHTML='<div style="padding:20px;text-align:center"><p style="margin:0 0 14px;color:#93a39a;line-height:1.6">यहाँ वीडियो नहीं चल सका। नीचे बटन से YouTube पर खोलिए।</p><a class="lec" style="text-align:center;margin:0" target="_blank" rel="noopener" href="https://www.youtube.com/playlist?list='+id+'">YouTube पर खोलें</a></div>'}
function vtitle(id,el){
if(TC[id]){el.textContent=TC[id];return}
fetch('https://www.youtube.com/oembed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)+'&format=json').then(function(r){return r.json()}).then(function(j){TC[id]=j.title;el.textContent=j.title}).catch(function(){})}
var GR=null,OPENK=null,CURL=null,SCRL=false;
function chNum(s){var m=String(s||'').match(/अध्याय\s*[-:–#]?\s*(\d{1,2})/)||String(s||'').match(/\b(?:chapter|chap|ch|unit|lesson)\.?\s*[-:–#]?\s*(\d{1,2})\b/i);return m?+m[1]:null}
function rng(a,b){var r=[];for(var i=a;i<b;i++)r.push(i);return r}
function groupsFrom(ids,l,tt){
var g=[];
if(l.ch){var c=l.ch;if(c[0][1]>1)g.push({n:'•',name:'Introduction',idx:rng(0,c[0][1]-1)});
c.forEach(function(x,k){g.push({n:k+1,name:x[0],idx:rng(x[1]-1,c[k+1]?c[k+1][1]-1:ids.length)})});return g}
var cur=null,found={};
ids.forEach(function(id,i){var m=chNum(tt[i]);
if(m!==null){found[m]=1;var ex=g.filter(function(x){return x.n===m})[0];if(!ex){ex={n:m,name:'Chapter '+m,idx:[]};g.push(ex)}cur=ex}
else if(!cur){cur={n:'•',name:'Introduction',idx:[]};g.push(cur)}
cur.idx.push(i)});
if(Object.keys(found).length>=2)return g;
return topicGroups(ids,tt)}
function loadTitles(ids,cb){var i=0,done=0;function next(){if(i>=ids.length)return;var id=ids[i++];
if(TC[id]){fin();return}
fetch('https://www.youtube.com/oembed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)+'&format=json').then(function(r){return r.json()}).then(function(j){TC[id]=j.title}).catch(function(){}).then(fin)}
function fin(){done++;if(done===ids.length)cb(ids.map(function(x){return TC[x]||''}));else next()}
if(!ids.length)return cb([]);for(var w=0;w<Math.min(8,ids.length);w++)next()}
function openChap(k){var h=document.querySelector('.chh[data-k="'+k+'"]');if(!h)return;var b=h.nextElementSibling;
if(!b.dataset.f){b.dataset.f=1;GR[k].idx.forEach(function(i){var x=document.createElement('button');x.type='button';x.className='vi';x.dataset.i=i;
x.innerHTML='<span class="vn">'+(i+1)+'</span><span class="vt">Lecture '+(i+1)+'</span>';b.appendChild(x);vtitle(OPENK[i],x.querySelector('.vt'))})}
b.hidden=false;h.setAttribute('aria-expanded','true')}
function mark(){if(!YTP)return;var i=-1;try{i=YTP.getPlaylistIndex()}catch(e){}
document.querySelectorAll('.vi').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i)})}
function flat(ids){
var vl=$('vl'),shown=0;GR=null;if(SCRL){SCRL=false;setTimeout(function(){vl.scrollIntoView({behavior:'smooth',block:'start'})},60)}var pp0=$('player');if(pp0)pp0.classList.remove('off');
vl.innerHTML='<h4 class="sec">Lectures · '+ids.length+'</h4><div id="vitems"></div><button type="button" class="vmore" id="vmore"></button>';
function more(){var end=Math.min(ids.length,shown+30),box=$('vitems');
for(var i=shown;i<end;i++){var b=document.createElement('button');b.type='button';b.className='vi';b.dataset.i=i;
b.innerHTML='<span class="vn">'+(i+1)+'</span><span class="vt">Lecture '+(i+1)+'</span>';box.appendChild(b);vtitle(ids[i],b.querySelector('.vt'))}
shown=end;var m=$('vmore');m.style.display=shown<ids.length?'block':'none';m.textContent='और लेक्चर दिखाएँ ('+(ids.length-shown)+')';mark()}
$('vmore').onclick=more;more()}
var WK='sl_watched';
function wget(){try{return JSON.parse(localStorage.getItem(WK)||'{}')}catch(e){return{}}}
function wset(id){try{var w=wget();if(!w[id]){w[id]=1;localStorage.setItem(WK,JSON.stringify(w))}}catch(e){}}
function isDpp(t){return /dpp/i.test(t||'')}
function pad(n){return n==='•'?'INTRO':'CH - '+('0'+n).slice(-2)}
function cleanName(t,n){
if(n==='•')return 'Introduction';
var s=String(t||'').replace(/(?:अध्याय|chapter|chap|ch|unit|lesson)\.?\s*[-:–#]?\s*\d{1,2}/ig,'|').replace(/(?:lecture|lec|part|पाठ|लेक्चर)\.?\s*[-:–#]?\s*\d{1,3}/ig,'|').replace(/#\S+/g,'|').replace(/[\(\[][^\)\]]*[\)\]]/g,'|');
var p=s.split(/[|:–—]+|\s-\s/).map(function(x){return x.trim()}).filter(function(x){return x.length>3&&!/^(dpp|one shot|full chapter|class \d+.*)$/i.test(x)});
p.sort(function(a,b){return b.length-a.length});
return p[0]||('Chapter '+n)}
function topicKey(t){return String(t||'').toLowerCase().replace(/(?:lecture|lec|part|day|लेक्चर|पाठ|भाग)\.?\s*[-:–#]?\s*\d{1,3}/g,' ').replace(/#\S+/g,' ').replace(/[\(\[][^\)\]]*[\)\]]/g,' ').replace(/\b\d{1,3}\b/g,' ').replace(/\b(dpp|one shot|oneshot|revision|discussion|practice|pyq|ncert|full|complete|chapter|batch|lecture|class)\b/g,' ').replace(/[|:–—\-_,.!?\/]+/g,' ').replace(/\s+/g,' ').trim()}
function sameTopic(a,b){if(a===b)return true;if(a.indexOf(b)>=0||b.indexOf(a)>=0)return true;
var x=a.split(' '),y=b.split(' '),c=0;x.forEach(function(w){if(y.indexOf(w)>=0)c++});return c/Math.max(x.length,y.length)>=0.6}
function topicGroups(ids,tt){
var g=[],cur=null;
ids.forEach(function(id,i){var k=topicKey(tt[i]);
if(k.length>=4&&(!cur||!sameTopic(k,cur.key))){cur={n:g.length+1,name:'Chapter '+(g.length+1),key:k,idx:[]};g.push(cur)}
else if(!cur){cur={n:1,name:'Chapter 1',key:'',idx:[]};g.push(cur)}
cur.idx.push(i)});
return(g.length<2||g.length>ids.length/2)?null:g}
function showChapters(){
var p=$('player');if(p){p.classList.add('off');p.classList.remove('stk');try{YTP&&YTP.pauseVideo()}catch(e){}}
var vl=$('vl'),w=wget();
if(SCRL){SCRL=false;setTimeout(function(){vl.scrollIntoView({behavior:'smooth',block:'start'})},60)}
vl.innerHTML='<h4 class="sec">'+GR.length+' Chapters · '+OPENK.length+' Lectures</h4>'+GR.map(function(x,k){
var d=x.idx.filter(function(i){return isDpp(TC[OPENK[i]])}),nl=x.idx.length-d.length,wl=0,wd=0;
x.idx.forEach(function(i){if(w[OPENK[i]]){if(isDpp(TC[OPENK[i]]))wd++;else wl++}});
var f=x.idx.filter(function(i){return !isDpp(TC[OPENK[i]])})[0];if(f===undefined)f=x.idx[0];
x.nm=(CURL&&CURL.ch)?x.name:cleanName(TC[OPENK[f]],x.n);
return'<div class="c2"><button type="button" class="cc" data-k="'+k+'" aria-expanded="false"><span class="pill">'+pad(x.n)+'</span><span class="vt"><b>'+esc(x.nm)+'</b><small>Lecture: '+wl+'/'+nl+(d.length?' • DPP: '+wd+'/'+d.length:'')+'</small></span><span class="go">▾</span></button><div class="lb" hidden></div></div>'}).join('')}
function toggleChap(k){
var cs=document.querySelectorAll('.cc');
cs.forEach(function(c){if(+c.dataset.k!==k&&c.getAttribute('aria-expanded')==='true'){c.setAttribute('aria-expanded','false');c.nextElementSibling.hidden=true}});
var c=cs[k],b=c.nextElementSibling,open=c.getAttribute('aria-expanded')==='true';
if(open){c.setAttribute('aria-expanded','false');b.hidden=true;return}
var g=GR[k],w=wget();b.innerHTML='';
g.idx.forEach(function(i,j){var x=document.createElement('button');x.type='button';x.className='vi'+(w[OPENK[i]]?' done':'');x.dataset.i=i;
var t=TC[OPENK[i]];x.innerHTML='<span class="vn">'+(j+1)+'</span><span class="vt">'+esc(t||('Lecture '+(i+1)))+'</span>';b.appendChild(x);
if(!t)vtitle(OPENK[i],x.querySelector('.vt'))});
b.hidden=false;c.setAttribute('aria-expanded','true');mark();
setTimeout(function(){var r=c.getBoundingClientRect();if(r.top<80||r.top>window.innerHeight*0.6)window.scrollBy({top:r.top-90,behavior:'smooth'})},30)}
function buildList(ids,l){
var vl=$('vl');OPENK=ids;GR=null;
function show(g){if(!g){flat(ids);return}GR=g;CURL=l;showChapters()}
if(l.ch){show(groupsFrom(ids,l,[]));return}
vl.innerHTML='<p class="empty">चैप्टर के हिसाब से सूची बन रही है…</p>';
loadTitles(ids,function(tt){show(groupsFrom(ids,l,tt))})}
$('body').addEventListener('click',function(e){
var c=e.target.closest('.cc');if(c){toggleChap(+c.dataset.k);return}
var v=e.target.closest('.vi');if(v&&YTP){var p=$('player');p.classList.remove('off');p.classList.add('stk');YTP.playVideoAt(+v.dataset.i)}});
function openPl(l,btn){
killPlayer();var p=$('player'),vl=$('vl');p.hidden=false;vl.innerHTML='';
document.querySelectorAll('.lec').forEach(function(b){b.removeAttribute('aria-current')});if(btn)btn.setAttribute('aria-current','true');
if(/claude/i.test(location.hostname)){openLink(l.id);return}
p.style.aspectRatio='';p.classList.add('off');p.classList.remove('stk');p.innerHTML='<div id="yt"></div>';
var pv={listType:'playlist',list:l.id,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3};
if(location.protocol.indexOf('http')===0)pv.origin=location.origin;
ytApi(function(){
YTP=new YT.Player('yt',{width:'100%',height:'100%',playerVars:pv,events:{
onReady:function(e){var me=YTP,n=0;(function poll(){if(me!==YTP)return;var ids=[];try{ids=me.getPlaylist()||[]}catch(x){}
if(ids.length)buildList(ids,l);else if(n++<24)setTimeout(poll,500);else vl.innerHTML='<p class="empty">लेक्चर की सूची नहीं मिल पाई। पेज रिफ्रेश करके देखिए।</p>'})()},
onStateChange:function(e){mark();if(e.data===1){try{var vd=YTP.getVideoData();if(vd&&vd.video_id){wset(vd.video_id);var el=document.querySelector('.vi[data-i="'+YTP.getPlaylistIndex()+'"]');if(el)el.classList.add('done')}}catch(x){}}if(e.data===0){try{var ids=YTP.getPlaylist()||[];if(YTP.getPlaylistIndex()===ids.length-1)YTP.stopVideo()}catch(x){}}}}})
},function(){openLink(l.id)})}
function CL(n){return APPS[S.app].en?'Class '+n:'कक्षा '+n}
function curC(){return APPS[S.app].classes.filter(function(c){return c.n===S.cls})[0]}
function render(){
killPlayer();GR=null;var a=APPS[S.app],c=curC(),h='';
var cl=$('classes');cl.hidden=!!c;
cl.innerHTML=c?'':a.classes.map(function(k){return'<button type="button" class="cls" data-n="'+k.n+'"><b>'+CL(k.n)+'</b><small>Education Must Be <em>Free</em></small></button>'}).join('');
var b=$('body'),it=null;
if(!c){h=''}
else if(S.item===null){
h='<div class="chead"><b>'+CL(c.n)+'</b><small>'+(c.sub?esc(c.sub)+' · ':'')+'Education Must Be <em>Free</em></small></div><div class="cards'+(c.items.length===1?' one':'')+'">'+c.items.map(function(x,i){return'<button type="button" class="batch" data-o="'+i+'"><b>'+esc(x.name)+'</b><small>'+esc(x.sub||CL(c.n))+'</small></button>'}).join('')+'</div>'}
else{
it=c.items[S.item];var bn=it.banner||it.name.toUpperCase();
h='<div class="subj'+(bn.length>10?' sm':'')+'">'+esc(bn)+'</div><h3 class="bt">'+esc(it.hn||(it.banner?it.name:CL(c.n)))+'</h3>'
+'<div class="tabs"><button type="button" class="tab'+(S.tab==='lec'?' on':'')+'" data-t="lec">Lectures</button><button type="button" class="tab'+(S.tab==='pdf'?' on':'')+'" data-t="pdf">PDF</button></div>';
if(S.tab==='lec'){
var pl=it.pl||[],multi=pl.some(function(x){return x.sec}),last=null;
var gsec=(it.lec||[]).some(function(x){return x.sec});
if(gsec){var ord=[],by={};pl.forEach(function(l,i){var s=l.sec||'Lectures';if(!by[s]){by[s]=[];ord.push(s)}by[s].push('<button type="button" class="lec" data-p="'+i+'">▶ '+esc(l.title)+(l.count?' · '+l.count+' lectures':'')+'</button>')});
it.lec.forEach(function(l,i){var s=l.sec||'Lectures';if(!by[s]){by[s]=[];ord.push(s)}by[s].push('<button type="button" class="lec" data-i="'+i+'">▶ '+esc(l.title)+'</button>')});
h+=ord.map(function(s){return'<h4 class="sec">'+esc(s)+'</h4>'+by[s].join('')}).join('')}
else{if(pl.length>1)h+=pl.map(function(l,i){var s=multi?(l.sec||'Regular Lectures'):'';var hd=(s&&s!==last)?'<h4 class="sec">'+esc(s)+'</h4>':'';last=s;return hd+'<button type="button" class="lec" data-p="'+i+'">▶ '+esc(l.title)+(l.count?' · '+l.count+' lectures':'')+'</button>'}).join('');
else if(pl.length===1)h+='<h4 class="sec ph">'+esc(pl[0].title)+'</h4>';
h+=it.lec.map(function(l,i){return'<button type="button" class="lec" data-i="'+i+'">▶ '+esc(l.title)+'</button>'}).join('');}
h+='<div class="player" id="player" hidden></div><div id="vl"></div>';
if(!pl.length&&!it.lec.length)h+='<p class="empty">लेक्चर जल्द जोड़े जाएंगे।</p>'}
else{h+=it.pdf.length?it.pdf.map(function(l){return'<a class="lec" target="_blank" rel="noopener" href="'+esc(l.url)+'">📄 '+esc(l.title)+'</a>'}).join(''):'<p class="empty">PDF जल्द जोड़े जाएंगे।</p>'}
}
b.innerHTML=h;
if(it&&S.tab==='lec'){
b.querySelectorAll('.lec[data-p]').forEach(function(x){x.onclick=function(){SCRL=!!gsec;openPl(it.pl[x.dataset.p],x)}});
b.querySelectorAll('.lec[data-i]').forEach(function(x){x.onclick=function(){play(it.lec[x.dataset.i].url,x);if(gsec)setTimeout(function(){$('player').scrollIntoView({behavior:'smooth',block:'center'})},80)}});
if(it.pl.length&&!it.lec.length)openPl(it.pl[0],b.querySelector('.lec[data-p]'));
else if(!it.pl.length&&it.lec.length===1){var one=b.querySelector('.lec[data-i]');if(one)one.click()}}
}
function route(){
var k=location.hash.slice(1),a=APPS[k];
if(a&&S.app!==k){S.app=k;S.cls=null;S.item=null;S.tab='lec'}
$('home').style.display=a?'none':'block';$('app').style.display=a?'block':'none';$('back').hidden=!a;
if(a){$('a-img').src=document.querySelector('[data-app="'+k+'"] img').src;$('a-name').textContent=a.name;$('a-tag').textContent=a.tag;render()}
window.scrollTo(0,0)}
function menu(o){document.body.classList.toggle('open',o);$('menu').setAttribute('aria-expanded',o)}
function go(k){menu(false);if(location.hash==='#'+k)route();else location.hash=k}
$('menu').onclick=function(){menu(true)};$('scrim').onclick=function(){menu(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape')menu(false)});
$('d-home').onclick=function(){menu(false);location.hash='';route()};
$('d-kmd').onclick=function(){go('kmd')};
$('d-eb').onclick=function(){go('eb')};
$('d-gg').onclick=function(){go('gg')};
$('back').onclick=function(){if(S.item!==null){S.item=null;render()}else if(S.cls!==null){S.cls=null;render()}else{location.hash='';route()}};
$('classes').onclick=function(e){var t=e.target.closest('.cls');if(t){S.cls=+t.dataset.n;S.item=null;S.tab='lec';render();window.scrollTo(0,0)}};
$('body').onclick=function(e){var t=e.target.closest('[data-o],.tab');if(!t)return;if(t.dataset.o!==undefined){S.item=+t.dataset.o;S.tab='lec'}else S.tab=t.dataset.t;render()};
window.addEventListener('hashchange',route);route();

</script>
</body>
</html>
